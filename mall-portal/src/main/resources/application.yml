spring:
  application:
    name: mall-portal
  profiles:
    active: dev #默认为开发环境
  # 始终排除 Spring AI 的 ChatClient 自动配置。
  #
  # 为什么要排除：ChatClientAutoConfiguration 会**无条件**创建 ChatClient.Builder，
  # 而它依赖 ChatModel。没配 Key 时 ChatModel 不存在，于是每次请求 /ai/** 都会抛
  # NoSuchBeanDefinitionException，被全局异常处理成 401 —— 看起来像鉴权失败，
  # 实际是 bean 缺失，排查方向会被带偏很远（日志里能看到 "checking username:test"
  # 却看不到 "authenticated user"，极具误导性）。
  #
  # 配了 Key 时也不需要它：ApiAgentController 里用 ChatClient.create(chatModel)
  # 手动构建，等价于自动配置的产物，还少一层隐式依赖。
  autoconfigure:
    exclude:
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3          # 总共尝试 3 次（首次 + 重试 2 次）
          initial-interval: 1000ms # 首次重试等 1 秒
          multiplier: 2.0          # 退避倍数：1s → 2s
          max-interval: 10000ms
        # 关键：重试耗尽后不要重新入队，否则消息会在队列里无限循环把队列堵死。
        # 设为 false 后，被拒绝的消息会按队列配置的 x-dead-letter-exchange 进死信队列。
        default-requeue-rejected: false

  # ============================ AI 能力配置 ============================
  # 模型：DeepSeek（Spring AI 1.1.0 starter）
  # Key 的给法，优先级从高到低：
  #   1. 环境变量 DEEPSEEK_API_KEY（推荐，不落盘）
  #   2. 启动参数 --spring.ai.deepseek.api-key=sk-xxx（临时验证用）
  # ★ 绝不把真实 Key 写进本文件 —— 本文件是入库的
  #
  # 为什么这里不写 SpEL 自动推断：试过 ${...#{...'none' : 'deepseek'}}，
  # SnakeYAML 会把三元里的 ": " 当成键值分隔符，直接解析失败（mapping values are not allowed here）。
  # 改用最朴素的方式：值留空，由 AI_CHAT_PROVIDER 显式指定（不设时默认 none）。
  # 想启用 AI：   set AI_CHAT_PROVIDER=deepseek  再设 DEEPSEEK_API_KEY
  # 不设这两个变量 → AI 关闭，其它功能完全正常。
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat      # 对话/工具调用模型
          temperature: 0.3          # 偏低：查订单类任务要稳定，不需要发挥
          max-tokens: 2048
    # ---- MCP Server（第 4 步）：把商品类工具用 MCP 协议暴露 ----
    # protocol=STREAMABLE：SSE 在 Spring AI 2.0 已标记 deprecated，
    # STREAMABLE 是替代者，同样基于 HTTP，更适合无状态部署。
    # 不配 protocol 时 MCP Server 不启动（McpServerConfig 用 @ConditionalOnProperty 守卫），
    # 这样『不想要 MCP』的用户只要不配这一项即可，零副作用。
    mcp:
      server:
        name: mall-product-mcp
        version: 1.0.0
        protocol: ${MCP_PROTOCOL:STREAMABLE}
        type: SYNC
    # ---- Ollama：本地 embedding 模型（RAG 的向量化）----
    # 为什么单独指定 base-url：Ollama 默认跑在 11434，
    # 显式写出来便于将来换到别的机器或容器。
    # 注意：Ollama 不可达时 embedding 会失败，但**不影响其他功能** ——
    # KnowledgeRetriever 会把检索异常降级成「没检索到」。
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:bge-m3}

    # ---- Milvus 向量库（RAG 的存储与检索）----
    # 为什么不用项目已有的 ES：实测本机 ES 7.17.3 是 basic 许可，
    # 不支持 kNN 检索（报 Unknown key in [knn]，_knn_search 端点也不存在），
    # 而 Spring AI 的 ES 向量库正是靠 kNN 实现，走不通。
    # Milvus 支持 HNSW/IVF 等真 ANN 索引，是 JD 里最常见的向量库。
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
        database-name: ${MILVUS_DATABASE:default}
        collection-name: ${MILVUS_COLLECTION:mall_knowledge}
        # ★ 必须与实际 embedding 模型维度一致，否则写入会失败。
        # bge-m3 输出 1024 维（实测确认见 docs；换模型必须同步改这里）
        embedding-dimension: ${EMBEDDING_DIM:1024}
        index-type: HNSW
        metric-type: COSINE

# 没配模型时，把 ChatClient 自动配置一并排除（否则它会因缺 ChatModel 而让请求 500/401）。
# 配了模型时这一行不起作用 —— 由下面的 SpEL 判断决定。

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml

jwt:
  tokenHeader: Authorization #JWT存储的请求头
  secret: mall-portal-secret #JWT加解密使用的密钥
  expiration: 604800 #JWT的超期限时间(60*60*24*7)
  tokenHead: 'Bearer '  #JWT负载中拿到开头

secure:
  ignored:
    urls: #安全路径白名单
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /*/*.html
      - /*/*.js
      - /*/*.css
      - /*/*.png
      - /favicon.ico
      - /actuator/**
      - /druid/**
      - /sso/**
      - /home/**
      - /product/**
      - /brand/**
      # 只有异步回调必须匿名可访问（支付宝服务器要能打进来）
      # 原来的 /alipay/** 把 pay / webPay / query 也一起放开了，等于任何人可以匿名
      # 给任意订单发起支付、查询任意订单
      - /alipay/notify
      # 秒杀：只放行「查询类」接口，让未登录用户也能看到秒杀列表。
      # /seckill/order（下单）、/seckill/result/**（查结果）、/seckill/warmUp、
      # /seckill/reconcile 都「有意」不放行 —— 必须登录才能调。
      # 商品评价：查询类接口放行（评价是给所有浏览者看的，不是私人数据；
      # 要求登录才能看评价，等于把最重要的购买决策依据藏起来）
      - /member/comment/list
      - /member/comment/summary
      - /member/comment/replay/**
      - /member/comment/readCount/**
      # 注意：/member/comment/create（发评价）与 /collect/**（点赞）
      # 「有意」不放行 —— 它们必须绑定"是谁"
      - /seckill/current
      - /seckill/products
      # ---- MCP 端点（第 4 步）----
      # 必须放行给 Spring Security：MCP 客户端是外部程序（Claude Desktop / IDE 插件），
      # 不走 mall 的 JWT 登录，拿不到 Bearer token。
      #
      # ★ 放行 ≠ 无鉴权：鉴权改由 McpAuthFilter 在 HTTP 层用共享密钥完成
      #   （请求头 X-MCP-Token，常量时间比较，未配密钥则 fail-closed 拒绝一切）。
      #   这是一种「换一套更合适的鉴权方式」，而不是「取消鉴权」。
      - /mcp
      - /mcp/**

springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /swagger-ui.html
    # 开启Swagger UI界面
    enabled: true
    # 用于配置tag和operation的展开方式，这里配置为都不展开
    doc-expansion: 'none'
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
  group-configs:
    - group: 'mall-portal'
      packages-to-scan: com.macro.mall.portal.controller

# 自定义redis key
redis:
  database: mall
  key:
    authCode: 'ums:authCode'
    orderId: 'oms:orderId'
    member: 'ums:member'
  expire:
    authCode: 90 # 验证码超期时间
    common: 86400 # 24小时

mongo:
  insert:
    sqlEnable: true # 用于控制是否通过数据库数据来插入mongo

# 消息队列定义
rabbitmq:
  queue:
    name:
      cancelOrder: cancelOrderQueue


# Agent 运行时参数（手写循环用）
mall:
  ai:
    agent:
      enabled: true
      # 硬上限：防止模型陷入循环反复调工具，账单和延迟一起失控
      max-rounds: 6
      # 整体耗时上限（秒）
      timeout-seconds: 120
      # 滑动窗口：只保留最近 N 条消息
      max-history-messages: 20
      # 历史字符数上限 —— 比条数更关键：一条 tool 响应可能几万字符，
      # 「20 条」听起来不多，若其中有 10 条工具结果照样能撑爆窗口。
      # 真正的成本瓶颈是字符/token 数，不是条数。
      max-history-chars: 40000
      # 单条工具结果回填给模型时的字符上限（超出截断并注明）
      max-observation-chars: 6000
      # 是否把 trace 落盘成 JSONL（一行一条，便于 jq / pandas 分析）
      trace-enabled: true
      # trace 目录：放 logs 下，不进版本库（含用户问题与订单信息，属数据不属代码）
      trace-dir: logs/ai-trace
      # 是否把 trace 一并返回给调用方（演示/面试时可看完整执行路径）
      expose-trace: true
    # ============================ MCP Server 配置（第 4 步）============================
    # 把商品类只读工具用 MCP 协议暴露出去，任何支持 MCP 的客户端都能调用。
    # 为什么不暴露订单类工具：MCP 外部调用没有 SecurityContext，
    # 要查订单就只能让调用方传 memberId —— 那等于把身份交给对方指定，
    # 正是前面花大力气堵上的水平越权。所以 MCP 只开放公开的商品数据。
    mcp:
      # 共享密钥（请求头 X-MCP-Token）。**留空则整个 MCP 端点拒绝服务**（fail-closed），
      # 这是有意的：『忘了配』不应该导致端口对全世界敞开。
      auth-token: ${MCP_AUTH_TOKEN:}

    # ============================ RAG 配置（第 5 步）============================
    # RAG = 检索增强生成：先把相关知识检索出来，再让模型带着资料回答。
    # 解决的是「模型不知道你家具体规定」的问题 —— 客服政策这种私有知识，
    # 模型训练时不可能见过，不查资料就只能编。
    rag:
      enabled: ${RAG_ENABLED:false}
      # 启动时自动加载知识库到向量库（幂等：按标题 hash 覆盖，不会重复堆积）
      load-on-startup: true
      # 检索返回的知识块数量。不是越大越好：每块都进 prompt，
      # topK 过大既涨成本，又会引入无关内容让模型编答案。
      top-k: 3
      # ★ 相似度阈值 —— RAG 效果的关键开关。
      # 向量检索永远返回 topK 条（哪怕问「今天天气」也会硬找三条政策），
      # 没有阈值模型就会拿无关内容硬编；设了阈值检索不到就返回空，
      # 模型才能老实说「这个我不知道」。
      similarity-threshold: 0.5
      # 检索结果注进 prompt 的最大字符数
      max-context-chars: 3000