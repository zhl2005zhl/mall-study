spring:
  application:
    name: mall-search
  profiles:
    active: dev #默认为开发环境
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3          # 商品索引同步重试 3 次
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms
        # 重试耗尽后不要重新入队（会让队列无限循环），改为进死信队列由对账兜底
        default-requeue-rejected: false

server:
  port: 18088

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml

jwt:
  tokenHeader: Authorization #JWT存储的请求头
  # 必须与 mall-admin 用同一个密钥：后台登录拿到的 token 才能直接用来调索引维护接口
  secret: mall-admin-secret #JWT加解密使用的密钥
  expiration: 604800 #JWT的超期限时间(60*60*24*7)（秒）
  tokenHead: 'Bearer '  #JWT负载中拿到开头

redis:
  database: mall
  key:
    resourceList: 'ums:resourceList'
  expire:
    common: 86400 # 24小时

secure:
  ignored:
    urls: #安全路径白名单
      # ---- 只放行「查询类」接口：搜索服务对前台是只读的 ----
      - /esProduct/search
      - /esProduct/search/**
      - /esProduct/recommend/**
      # ---- 其它基础路径 ----
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /favicon.ico
      - /actuator/**
      - /druid/**

# 注意：/esProduct/importAll、/esProduct/create/{id}、/esProduct/delete/{id}、
#       /esProduct/delete/batch 这四个索引维护接口「有意」不放进白名单 ——
#       它们会触发全量导入 / 增删索引文档，属于管理操作，必须带 token 才能调用。

springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /swagger-ui.html
    # 开启Swagger UI界面
    enabled: true
    # 用于配置tag和operation的展开方式，这里配置为都不展开
    doc-expansion: 'none'
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
  group-configs:
    - group: 'mall-search'
      packages-to-scan: com.macro.mall.search.controller

# 商品索引同步相关
mall:
  es-sync:
    reconcile:
      enabled: true
      cron: "0 */10 * * * ?"   # 每 10 分钟对账一次
